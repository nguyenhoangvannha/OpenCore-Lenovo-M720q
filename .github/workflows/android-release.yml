name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Lenovo M720q EFI Tool APK'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Prepare APK for Release
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'latest' }}"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Lenovo-M720q-EFI-Tool-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/Lenovo-M720q-EFI-Tool.apk"
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lenovo-M720q-EFI-Tool-APK
          path: release-artifacts/*.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Lenovo M720q EFI Tool ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.title }}
          draft: false
          prerelease: false
          files: |
            release-artifacts/*.apk
          generate_release_notes: true
          body: |
            ### 📱 Lenovo M720q EFI Tool (Android APK)
            
            Ứng dụng Android hỗ trợ kết nối USB qua cổng OTG, tự động xin quyền Root (Magisk / KernelSU / APatch), dò phân vùng EFI và copy OpenCore EFI an toàn.
            
            #### Hướng dẫn cài đặt:
            1. Tải file `Lenovo-M720q-EFI-Tool.apk` bên dưới về điện thoại Android.
            2. Mở file APK và chọn Cài đặt (Install).
            3. Mở ứng dụng và cấp quyền Root khi được yêu cầu.
